<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cine Cam Viewer</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:15px system-ui,sans-serif;color:#7e838c}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#s{position:fixed;left:0;right:0;top:46%;text-align:center}
#u{position:fixed;right:12px;bottom:12px;opacity:.6;font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #333;background:#111;color:#eee}
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="s">Connecting…</div>
<button id="u" hidden>Tap for sound</button>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const id=new URLSearchParams(location.search).get('id');
const v=document.getElementById('v'),s=document.getElementById('s'),u=document.getElementById('u');
let conn=null,got=false;
function status(t){s.textContent=t;s.hidden=false}
if(!id){status('Missing ?id= in the link.')}
else{
  const peer=new Peer();
  const connect=()=>{
    if(got)return;
    if(conn)try{conn.close()}catch(e){}
    conn=peer.connect(id);
    conn.on('open',()=>status('Waiting for video…'));
    conn.on('close',()=>{if(!got)setTimeout(connect,2000)});
  };
  peer.on('open',connect);
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{status(e.type==='peer-unavailable'?'Phone not live yet. Tap Live in Cine Cam…':'Error: '+e.type);if(e.type==='peer-unavailable')setTimeout(connect,3000)});
  peer.on('call',call=>{
    call.answer();
    call.on('stream',st=>{
      got=true;s.hidden=true;v.srcObject=st;v.muted=false;
      v.play().catch(()=>{v.muted=true;v.play();u.hidden=false});
    });
    call.on('close',()=>{got=false;status('Reconnecting…');setTimeout(connect,1500)});
  });
  u.onclick=()=>{v.muted=false;u.hidden=true};
}
</script>
</body>
</html>
