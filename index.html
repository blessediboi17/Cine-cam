<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Cine Cam</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="stage">
  <div id="frame">
    <video id="v" autoplay playsinline muted></video>
    <canvas id="fx" width="192" height="108"></canvas>
    <div id="guide"><i></i></div>
    <div id="grid"></div>
  </div>
  <canvas id="hist" width="128" height="56"></canvas>
  <div id="level"></div>
  <div id="meter" hidden><div id="mcov"></div><div id="mpk"></div></div>
  <span id="mdb" hidden>-∞</span>
  <section id="pr" hidden>
    <div id="prview"><div id="prtext"></div></div>
    <textarea id="prsrc" rows="6" placeholder="Paste your script here" aria-label="Script"></textarea>
    <div class="prc">
      <label>Speed <input id="prspd" type="range" min="10" max="240"></label>
      <label>Size <input id="prsz" type="range" min="20" max="90"></label>
    </div>
    <div class="row">
      <button class="btn" id="prmir">Mirror</button>
      <button class="btn" id="prgo">Start</button>
      <button class="btn" id="predit" hidden>Edit</button>
      <button class="btn" id="prx">Close</button>
    </div>
  </section>
  <header id="hud">
    <span class="pill" id="h-fmt">Starting…</span>
    <span class="pill"><i id="dot"></i><span id="h-time">00:00:00</span></span>
    <span class="pill" id="h-sys"></span>
  </header>
  <section id="livebox" hidden>
    <b>Live to OBS</b>
    <label class="lbl">OBS link</label>
    <input id="lurl" readonly>
    <label class="lbl">Remote control link (PC)</label>
    <input id="lremote" readonly>
    <div class="row"><span><button class="btn" id="lcopy">Copy OBS</button> <button class="btn" id="lcopy2">Copy remote</button></span><span id="lstat">Starting…</span></div>
    <p>OBS: add a <b>Browser Source</b>, paste the OBS link, set 1920×1080. Open the remote link in any PC browser to control the camera. Keep this page open on the phone.</p>
  </section>
  <div id="toast"></div>
</main>
<footer id="dock">
  <div class="scroll" id="tiles"></div>
  <div id="adj">
    <button class="tool" id="auto">Auto</button>
    <button class="tool" id="snap" hidden>180°</button>
    <input id="sl" type="range" min="0" max="1000" step="1" disabled aria-label="Value">
  </div>
  <div class="scroll" id="tools">
    <button class="tool" data-tool="zebra">Zebra</button>
    <button class="tool" data-tool="peak">Peaking</button>
    <button class="tool" data-tool="hist">Histogram</button>
    <button class="tool" data-tool="grid">Grid</button>
    <button class="tool" data-tool="level">Level</button>
    <button class="tool" id="torch" hidden>Torch</button>
    <button class="tool" id="prbtn">Prompter</button>
    <button class="tool" data-tool="clean">Clean feed</button>
    <select id="mic" aria-label="Microphone"><option value="">Mic: Default</option></select>
    <select id="guide-sel" aria-label="Frame guide">
      <option value="0">No guide</option><option value="2.39">2.39:1</option><option value="2">2:1</option>
      <option value="1.85">1.85:1</option><option value="1.7778">16:9</option><option value="1.3333">4:3</option><option value="0.5625">9:16</option>
    </select>
    <select id="lut" aria-label="Look preview">
      <option value="none">Look: Natural</option><option value="cine">Look: Cine</option><option value="mono">Look: Mono</option>
      <option value="warm">Look: Warm</option><option value="cool">Look: Cool</option>
    </select>
    <select id="mbps" aria-label="Bitrate">
      <option value="10">10 Mb/s</option><option value="20">20 Mb/s</option><option value="40">40 Mb/s</option><option value="60">60 Mb/s</option>
    </select>
  </div>
  <div id="bar">
    <div class="col">
      <select id="res" aria-label="Resolution"><option value="720">720p</option><option value="1080">1080p</option><option value="2160">4K</option></select>
      <select id="fps" aria-label="Frame rate"><option value="24">24 fps</option><option value="25">25 fps</option><option value="30">30 fps</option><option value="60">60 fps</option></select>
    </div>
    <button id="rec" aria-label="Record"></button>
    <div class="col">
      <button class="btn" id="live">Live</button>
      <button class="btn" id="flip">Flip</button>
    </div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="live.js"></script>
<script src="app.js"></script>
</body>
</html>
